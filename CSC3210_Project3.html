<html>
<head>
    <title>CSC3210 Galactic Glide</title>
    <style>
    body {
      margin: 0; 
      overflow: hidden;
      cursor: none;
    } /* Removes the default border and scrollbars and hides the mouse cursor during flight */

    #hud {
        position: fixed;
        top: 15px;
        left: 15px;
        color: #5fd4ff;
        font-family: monospace;
        font-size: 18px;
        z-index: 10;
    }
    </style>
</head>
<body>
    <div id="hud">
      <div id="speedDisplay">Speed: 40</div>
      <div id="headingDisplay">Heading: 0°</div>
      <div id="pitchDisplay">Pitch: 0°</div>
      <div id="distanceDisplay">Distance: 0</div>
      <div id="timeDisplay">Flight Time: 00:00</div>
      <div id="fpsDisplay">FPS: --</div>
      <div id="collisionDisplay">Collisions: 0</div>
    </div>
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// Initialize the Scene
const scene = new THREE.Scene();

// Geometry of the sun added (for directional lighting). The sun follows the ship and repositions 
const sunGeometry = new THREE.SphereGeometry(200,200,200);
const sunMaterial = new THREE.MeshBasicMaterial({color: 0xff9900});
const sun = new THREE.Mesh(sunGeometry, sunMaterial);
// Position it far enough away so no meteors clip through it. Exactly 1 less of the bound from the stars.
sun.position.set(100, 100, -1499);
scene.add(sun);

// Add ambient lighting throughout the scene
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

// Add a directional light (as the sun)
const directionalLight = new THREE.DirectionalLight(0xFFB300, 40);
scene.add(directionalLight);

// Configure the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  75, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  2000
);

// Group that represents the ship and carries the cameras
const ship = new THREE.Group();
ship.add(camera);
scene.add(ship);

// Configuration for collision detection and asteroid bounce reaction
const shipCollisionRadius = 30;
const bounceStrength = 125;

// Configuration for the collision screen shake
const shakeDuration = 0.25;
const shakeStrength = 1.0;
let shakeTime = 0;

// Create the geometry for the ship's energy shield
const shieldGeometry = new THREE.SphereGeometry(4, 32, 16);

// Use alpha blending to create a transparent energy shield around the ship.
const shieldMaterial = new THREE.MeshBasicMaterial({
  color: 0x5fd4ff,
  transparent: true,
  opacity: 0.1,
  blending: THREE.NormalBlending,
  side: THREE.BackSide
});

// Create the shield mesh and attach it to the ship
const shield = new THREE.Mesh(shieldGeometry, shieldMaterial);
ship.add(shield);

// IMPORTANT: Configuration for how many stars fill the background 
const starCount = 3000;

// Configuration for how far away the stars are placed
const starRadius = 1500;

// Function that creates the background starfield
function createStarfield() {
  // Array that stores the x, y, and z of every star
  const positions = new Float32Array(starCount * 3);

  // Iterates over every star and places it at a random point on a large sphere
  for (let i = 0; i < starCount; i++) {
    // Picks a random direction and pushes it out to the sphere's edge
    const direction = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize().multiplyScalar(starRadius);
    positions[i * 3] = direction.x;
    positions[i * 3 + 1] = direction.y;
    positions[i * 3 + 2] = direction.z;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  // Material that draws each star as a small white dot
  const material = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 2,
    sizeAttenuation: false // Keeps every star the same size no matter how far away it is
  });

  return new THREE.Points(geometry, material);
}

const starfield = createStarfield();
scene.add(starfield);

// IMPORTANT: Configuration for how many objects fill the space around the ship
const objectCount = 100;

// IMPORTANT: Configuration for how far the ship objects can be 
const fieldRadius = 600;

// Configuration for the closest an object can be placed to the ship
const minSpawnDistance = 50;

// Geometries for different shapes of varying asteroids
const objectGeometries = [
  new THREE.IcosahedronGeometry(3, 0),
  new THREE.OctahedronGeometry(3,0),
  new THREE.DodecahedronGeometry(3,0),
  new THREE.BoxGeometry(4.5, 4.5, 4.5),
  new THREE.SphereGeometry(3, 10, 8),
  new THREE.TetrahedronGeometry(3, 0)
];

// Hex-code colors that have large contrast to each other (so you can tell when they blend)
const objectColors = [
  0xff0000,
  0x00ff00,
  0x0000ff,
  0x00ffff,
  0xff00ff
];

// Array that stores every object in the field
const spaceObjects = [];

// Texture loader
const textureLoader = new THREE.TextureLoader();
const asteroidTexture = textureLoader.load('https://upload.wikimedia.org/wikipedia/commons/2/2c/Generic_Celestia_asteroid_texture.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original');

// Function that moves an object to a random spot around a center point
function placeRandomly(object, center) {
  // Picks a random direction
  const direction = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize();

  // Picks a random distance between the min and max
  const distance = minSpawnDistance + Math.random() * (fieldRadius - minSpawnDistance);

  object.position.copy(center).addScaledVector(direction, distance);
}

// Iterates over every object, gives it a size and position, and adds it to the scene
for (let i = 0; i < objectCount; i++) {
  // Decide which shape to give the asteroid
  const shapeID = Math.floor(Math.random() * objectGeometries.length);
  const geometry = objectGeometries[shapeID];

  // Compute a bounding sphere so the asteroid can be used for collision detection
  geometry.computeBoundingSphere();

  // Decide which color to give the asteroid and add the texture onto it
  const colorID = Math.floor(Math.random() * objectColors.length);
  
  // Vertex and fragment shader material
  const material = new THREE.ShaderMaterial({
    uniforms: {
      asteroidTexture: {value: asteroidTexture}, //Apply the texture to all asteroids
      asteroidColor: {value: new THREE.Color(objectColors[colorID])}, // Pick a random color out of the color array
      lightDirection: {value: new THREE.Vector3(0, -1, 0)},
      ambientStrength: {value: 0.85} // Configure the ambient light strength
    },
    
    // Vertex shader passes texture coordinates and normals to fragment shader. This is for the directional sunlight
    vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    
    void main() {
      vUv = uv; 
      vNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
    
    // Fragment shader normalizes the surface / light direction normals, calculated how far away they are.
    // Constant ambient light is calculated and that is combined with the directional sunlight
    fragmentShader: `
    uniform sampler2D asteroidTexture;
    uniform vec3 asteroidColor;
    uniform vec3 lightDirection;
    uniform float ambientStrength;

    varying vec2 vUv;
    varying vec3 vNormal;
    
    void main() {
      // Map the texture onto the asteroid  
      vec4 textureColor = texture2D(asteroidTexture, vUv);

      vec3 normal = normalize(vNormal);
      vec3 lightDir = normalize(-lightDirection);
      
      // Calculate the far distance of two vectors
      float lightAmount = max(dot(normal, lightDir), 0.0);
      vec3 ambient = vec3(ambientStrength);
      vec3 sunlight = vec3(1.0, 0.7, 0.1) * lightAmount * 4.0;
      
      // Calculate the combination of the ambient and sunlight
      vec3 lighting = ambient + sunlight;
      vec3 finalColor = textureColor.rgb * asteroidColor * lighting;
      gl_FragColor = vec4(finalColor, 1.0);
    }`,
    // Blending factors
    transparent: true,
    blending: THREE.CustomBlending,
    blendEquation: THREE.MaxEquation,
    blendSrc: THREE.OneFactor,
    blendDst: THREE.OneFactor,
    depthTest: false,
    depthWrite: false
  });

  // Set the size of the asteroid
  const spaceObject = new THREE.Mesh(geometry, material);
  spaceObject.baseSize = 8 + Math.random() * 1.35;
  spaceObject.scale.setScalar(spaceObject.baseSize);
  spaceObject.pulseSpeed = 0.75 * Math.random();

  // Store the asteroid's scaled collision radius and initial collision state
  spaceObject.collisionRadius = geometry.boundingSphere.radius * spaceObject.scale.x;
  spaceObject.isColliding = false;
  
  // Set random rotation speeds of each individual asteroid
  spaceObject.rotationSpeedX = Math.random() * 0.75;
  spaceObject.rotationSpeedY = Math.random() * 0.75;

  // Set random drifts of each individual asteroid
  spaceObject.driftX = 20 + (Math.abs(Math.random()) * 1.5)
  spaceObject.driftY = 20 + (Math.abs(Math.random()) * 1.5)
  spaceObject.driftZ = 20 + (Math.abs(Math.random()) * 1.5)

  // Configure whether the asteroid drifts straight or follows a curved path
  spaceObject.driftType = Math.floor(Math.random() * 2);
  spaceObject.curveSpeed = 1 + Math.random();
  spaceObject.curveAmount = 5 + Math.random() * 50;

  placeRandomly(spaceObject, ship.position);
  
  // Add the asteroid to the scene.
  scene.add(spaceObject);
  spaceObjects.push(spaceObject);
}

// Object that holds the mouse position from -1 to 1 (0 is the center of the screen)
const mouse = {
  x: 0,
  y: 0
};

// Function that converts the mouse position into the -1 to 1 range
function onMouseMove(event) {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1; // Flipped so up is positive
}

window.addEventListener('mousemove', onMouseMove);

// IMPORTANT: Configuration for how fast the ship turns (radians per second at the screen edge)
const turnSpeed = 1.5;

// Configuration for the max up/down angle so the ship can't flip over
const maxPitch = Math.PI / 2 - 0.01;

// Ship's current left/right (yaw) and up/down (pitch) angles
let yaw = 0;
let pitch = 0;

ship.rotation.order = 'YXZ'; // Applies yaw first, then pitch, like a first person camera

// IMPORTANT: Configuration for how fast the ship flies (units per second)
let shipSpeed = 40;

// IMPORTANT: Configuration for the slowest and fastest the ship can fly
const minSpeed = 0;
const maxSpeed = 100;

// Configuration for how quickly W and S change the speed (units per second, every second)
const shipAcceleration = 30;

// Object that tracks which speed keys are being held down
const keys = {
  w: false,
  s: false
};

// Function that marks W or S as held when it is pressed
function onKeyDown(event) {
  const key = event.key.toLowerCase(); // Treats W and w the same
  if (key === "w" || key === "s") {
    keys[key] = true;
  }
}

// Function that marks W or S as released when it is let go
function onKeyUp(event) {
  const key = event.key.toLowerCase();
  if (key === "w" || key === "s") {
    keys[key] = false;
  }
}

window.addEventListener('keydown', onKeyDown);
window.addEventListener('keyup', onKeyUp);

// Reference to the speed HUD
const speedDisplay = document.getElementById("speedDisplay");
speedDisplay.textContent = `Speed: ${shipSpeed}`;

// Track collisions and display the count in the HUD
let collisions = 0;
const collisionDisplay = document.getElementById("collisionDisplay");
collisionDisplay.textContent = `Collisions: ${collisions}`;

// References to the flight info HUD
const headingDisplay = document.getElementById("headingDisplay");
const pitchDisplay = document.getElementById("pitchDisplay");
const distanceDisplay = document.getElementById("distanceDisplay");
const timeDisplay = document.getElementById("timeDisplay");
const fpsDisplay = document.getElementById("fpsDisplay");

// Running totals for the distance flown (units) and time flown (seconds)
let distanceTraveled = 0;
let flightTime = 0;

// Function that turns a number seconds into mm:ss
function formatTime(totalSeconds) {
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = Math.floor(totalSeconds % 60);
  return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
}

// Configuration for how often the FPS display refreshes (seconds)
const fpsUpdateInterval = 0.5;

// Frames drawn and time passed since the FPS display last refreshed
let fpsFrameCount = 0;
let fpsTimer = 0;

// Vector that stores the direction the ship is facing (reused every frame)
const forward = new THREE.Vector3();

// Function that moves an object that fell out of range to a new spot
function respawnAhead(object) {
  // Picks a random direction
  const direction = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize();

  // Flips the direction if it points behind the ship
  if (direction.dot(forward) < 0) {
    direction.negate();
  }

  // Places it near the edge of the field so it doesn't pop in right next to the ship
  const distance = fieldRadius * (0.7 + Math.random() * 0.3);

  object.position.copy(ship.position).addScaledVector(direction, distance);
}

// IMPORTANT: Configuration for the rear-view mirror's size (fraction of the window)
const mirrorWidthFraction = 0.3;
const mirrorHeightFraction = 0.2;

// Configuration for the gap between the mirror and the top of the window (pixels)
const mirrorMargin = 10;

// IMPORTANT: Configuration for the mirror border's thickness (pixels)
const mirrorBorderSize = 3;
const mirrorBorderColor = 0x5fd4ff;

// Function that calculates the mirror's size and position in pixels
function getMirrorRectangle() {
  const width = window.innerWidth * mirrorWidthFraction;
  const height = window.innerHeight * mirrorHeightFraction;
  const x = (window.innerWidth - width) / 2; // Centers the mirror horizontally
  const y = window.innerHeight - height - mirrorMargin; // WebGL measures y from the bottom, so this places it at the top

  return {
    x: x,
    y: y,
    width: width,
    height: height
  };
}

// Camera that looks out the back of the ship for the rear-view mirror 
const startMirrorRectangle = getMirrorRectangle();
const rearCamera = new THREE.PerspectiveCamera(75, startMirrorRectangle.width / startMirrorRectangle.height, 0.1, 2000);
rearCamera.rotation.y = Math.PI; // Turns the camera 180 degrees to face backwards
ship.add(rearCamera);

// Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x000000, 1.0); // Black background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Function that resizes the camera and renderer to match the window
function onWindowResize() {
    // Updates the aspect ratio so the scene doesn't stretch
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Updates the rear camera's aspect ratio to match the mirror's new shape
    const mirrorRectangle = getMirrorRectangle();
    rearCamera.aspect = mirrorRectangle.width / mirrorRectangle.height;
    rearCamera.updateProjectionMatrix();
}

window.addEventListener('resize', onWindowResize);

// Clock that measures the time between frames
const clock = new THREE.Clock();

// Function that runs once per frame to update and draw the scene
function animate() {
  requestAnimationFrame(animate);

  // Calculates how many seconds passed since the last frame
  const deltaTime = Math.min(clock.getDelta(), 0.1); // Caps big jumps after switching tabs

  // Turns the ship based on how far the mouse is from the center
  yaw -= mouse.x * turnSpeed * deltaTime;
  pitch += mouse.y * turnSpeed * deltaTime;
  pitch = Math.max(-maxPitch, Math.min(maxPitch, pitch)); // Keeps pitch within its limits
  ship.rotation.set(pitch, yaw, 0);

  if (shakeTime > 0) {
    camera.position.x = (Math.random() * 2 - 1) * shakeStrength;
    camera.position.y = (Math.random() * 2 - 1) * shakeStrength;

    shakeTime -= deltaTime;
  } else {
    camera.position.set(0, 0, 0);
  }

  if (keys.w) {
    shipSpeed += shipAcceleration * deltaTime;
  }
  if (keys.s) {
    shipSpeed -= shipAcceleration * deltaTime;
  }
  shipSpeed = Math.max(minSpeed, Math.min(maxSpeed, shipSpeed)); // Keeps speed within its limits

  // Adds this frame's movement and time to the running totals
  distanceTraveled += shipSpeed * deltaTime;
  flightTime += deltaTime;

  // Converts yaw into a 0-359 compass heading that increases when turning right
  const heading = (Math.round(THREE.MathUtils.radToDeg(-yaw)) % 360 + 360) % 360;

  // Updates the HUD with the current flight info
  speedDisplay.textContent = `Speed: ${Math.round(shipSpeed)}`;
  headingDisplay.textContent = `Heading: ${heading}°`;
  pitchDisplay.textContent = `Pitch: ${Math.round(THREE.MathUtils.radToDeg(pitch))}°`;
  distanceDisplay.textContent = `Distance: ${Math.round(distanceTraveled)}`;
  timeDisplay.textContent = `Flight Time: ${formatTime(flightTime)}`;

  // Counts frames and refreshes the FPS display every half second
  fpsFrameCount++;
  fpsTimer += deltaTime;
  if (fpsTimer >= fpsUpdateInterval) {
    fpsDisplay.textContent = `FPS: ${Math.round(fpsFrameCount / fpsTimer)}`;
    fpsFrameCount = 0;
    fpsTimer = 0;
  }

  // Moves the ship forward in the direction the camera is looking
  camera.getWorldDirection(forward);
  ship.position.addScaledVector(forward, shipSpeed * deltaTime);
  sun.position.x = ship.position.x;
  sun.position.y = ship.position.y + 300;
  sun.position.z = ship.position.z - 1500;

  // Make the directional light target the area around the ship
  directionalLight.position.copy(sun.position);
  directionalLight.target.position.set(ship.position.x, ship.position.y, ship.position.z);
  scene.add(directionalLight.target);
  const lightDir = new THREE.Vector3().subVectors(directionalLight.target.position, directionalLight.position).normalize();
  
  // Make the light applied on all space objects.
  for (let i = 0; i < spaceObjects.length; i++)
  {
    spaceObjects[i].material.uniforms.lightDirection.value.copy(lightDir);
  }

  // Keeps the starfield centered on the ship so it never flies past the stars
  starfield.position.copy(ship.position);
  
  // Iterates over every object and respawns any that are out of range
  for (let i = 0; i < spaceObjects.length; i++) {
    const spaceObject = spaceObjects[i];

    // Change the size of each space object randomly as a pulse
    const sizeChange = 1 + Math.abs(Math.sin(clock.elapsedTime * spaceObject.pulseSpeed));
    spaceObject.scale.setScalar(spaceObject.baseSize * sizeChange);

    // Rotate each space object by its unique rotationSpeed
    spaceObject.rotation.x += spaceObject.rotationSpeedX * deltaTime;
    spaceObject.rotation.y += spaceObject.rotationSpeedY * deltaTime;

    // Drift each space object by its unique drift
    spaceObject.position.x += spaceObject.driftX * deltaTime;
    spaceObject.position.y += spaceObject.driftY * deltaTime;
    spaceObject.position.z += spaceObject.driftZ * deltaTime;

    // If the objects drift is designated to be curved, then curve it.
    if (spaceObject.driftType === 1) {
      spaceObject.position.x += Math.sin(clock.elapsedTime * spaceObject.curveSpeed) * spaceObject.curveAmount * deltaTime;
    }

    // Detect collisions, bounce the asteroid away, and update the collision counter
    const distance = ship.position.distanceTo(spaceObject.position);

    // Calculate the velocity of the meteor after a collision
    if (distance <= shipCollisionRadius + spaceObject.collisionRadius && !spaceObject.isColliding) {
      const collisionDirection = spaceObject.position.clone().sub(ship.position).normalize();

      // Alter the drift based on the collision
      spaceObject.driftX = collisionDirection.x * bounceStrength;
      spaceObject.driftY = collisionDirection.y * bounceStrength;
      spaceObject.driftZ = collisionDirection.z * bounceStrength;
      
      // Update collision factors
      spaceObject.isColliding = true;
      shakeTime = shakeDuration;
      collisions++;
      collisionDisplay.textContent = `Collisions: ${collisions}`;
    }

    // If the object is no longer in the collision radius, it is no longer colliding.
    if (distance > shipCollisionRadius + spaceObject.collisionRadius) {
      spaceObject.isColliding = false;
    }

    // If the object is too far, respawn the meteor
    if (distance > fieldRadius) {
      respawnAhead(spaceObject);
    }
    
  }

  // RASTERIZATION: Scissor test + viewports for the rear-view mirror
  // The scissor test makes WebGL only change pixels inside a rectangle, so the mirror can be drawn on top of the main view without erasing it
  renderer.setScissorTest(true);

  // Draws the main view across the whole window
  renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
  renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
  renderer.render(scene, camera);

  // Calculates where the mirror goes this frame
  const mirrorRectangle = getMirrorRectangle();

  // Draws the mirror's border by clearing a slightly bigger rectangle to the border color
  renderer.setScissor(
    mirrorRectangle.x - mirrorBorderSize,
    mirrorRectangle.y - mirrorBorderSize,
    mirrorRectangle.width + mirrorBorderSize * 2,
    mirrorRectangle.height + mirrorBorderSize * 2
  );
  renderer.setClearColor(mirrorBorderColor, 1.0);
  renderer.clear();
  renderer.setClearColor(0x000000, 1.0); // Switches back to black for the mirror's background

  // Draws the rear view only inside the mirror rectangle
  renderer.setViewport(mirrorRectangle.x, mirrorRectangle.y, mirrorRectangle.width, mirrorRectangle.height);
  renderer.setScissor(mirrorRectangle.x, mirrorRectangle.y, mirrorRectangle.width, mirrorRectangle.height);
  renderer.render(scene, rearCamera);
}

animate();
    </script>
</body>
</html>
